<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ImageForge — AI Image Enhancer & Compressor</title>
    <meta name="description" content="Client-side image compression and AI super-resolution upscaling powered by Real-ESRGAN. All processing happens locally in your browser — your images never leave your device." />
    <meta name="robots" content="index, follow" />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://imageforge.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://imageforge.app/" />
    <meta property="og:title" content="ImageForge — AI Image Enhancer & Compressor" />
    <meta property="og:description" content="Free, browser-based AI image upscaling and compression. No uploads, no server, 100% private." />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ImageForge — AI Image Enhancer & Compressor" />
    <meta name="twitter:description" content="Free, browser-based AI image upscaling and compression. No uploads, no server, 100% private." />
    <meta name="twitter:image" content="/og-image.svg" />

    <meta name="theme-color" content="#0a0b0f" />

    <!-- Google Fonts: non-blocking load with font-display:swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
